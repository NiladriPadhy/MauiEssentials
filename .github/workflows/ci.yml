# Hub CI is manual only. Do not add push or pull_request triggers.
# A manual run dispatches each plugin repo's CI, which owns
# NUGET_KEY / version checks, tests, pack, and nuget.org publish.
name: CI

on:
  workflow_dispatch:
    inputs:
      plugin:
        description: Plugin folder to trigger (empty = all submodules)
        required: false
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dispatch:
    name: Trigger submodule pipelines
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout hub
        uses: actions/checkout@v4

      - name: Dispatch plugin CI workflows
        env:
          HUB_DISPATCH_TOKEN: ${{ secrets.HUB_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          only_args=()
          if [ -n "${{ inputs.plugin }}" ]; then
            only_args=(--only "${{ inputs.plugin }}")
          fi
          python3 .github/scripts/dispatch-plugin-workflows.py \
            --ref main \
            --wait \
            "${only_args[@]}"
