# Copy to a plugin repository as .github/workflows/ci.yml
# so Plugin.Maui.* repos build without cloning the hub.
# Linux installs maui-android (the `maui` meta-workload is not supported there).
name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      publish:
        description: Push macOS .nupkg and .snupkg to NuGet.org
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    uses: nuvyntralabs/MauiEssentials/.github/workflows/plugin-ci.yml@main
    with:
      runner: ubuntu-latest
      frameworks: net10.0
      pack: true
      test: true

  macos:
    uses: nuvyntralabs/MauiEssentials/.github/workflows/plugin-ci.yml@main
    with:
      runner: macos-latest
      frameworks: net10.0,net10.0-android,net10.0-ios,net10.0-maccatalyst
      pack: true
      test: true
      install_workloads: true
      workloads: maui-android maui-ios maui-maccatalyst

  # Shared libraries and MVVMExpress also pack net10.0-windows on this runner.
  # Native Android/iOS plugins still succeed: unmatched Windows TFMs are skipped.
  windows:
    uses: nuvyntralabs/MauiEssentials/.github/workflows/plugin-ci.yml@main
    with:
      runner: windows-latest
      frameworks: net10.0,net10.0-windows
      pack: true
      test: true
      install_workloads: true
      workloads: maui-windows

  publish:
    name: NuGet.org
    needs: [linux, macos, windows]
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.publish) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) }}
    uses: nuvyntralabs/MauiEssentials/.github/workflows/publish-nuget.yml@main
    secrets:
      NUGET_KEY: ${{ secrets.NUGET_KEY }}
